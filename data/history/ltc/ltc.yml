name: Import Litecoin History

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-ltc:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download and convert LTCUSDT history
        run: |
          python - <<'PY'
          import csv, io, json, os, urllib.request, urllib.error, zipfile
          from datetime import date, datetime, timedelta, timezone

          OUT = "data/history/LTC"
          os.makedirs(OUT, exist_ok=True)
          days = {}

          def add_csv_bytes(blob, interval):
              with zipfile.ZipFile(io.BytesIO(blob)) as z:
                  name = next(n for n in z.namelist() if n.lower().endswith(".csv"))
                  with z.open(name) as f:
                      rows = csv.reader(io.TextIOWrapper(f, encoding="utf-8"))
                      for row in rows:
                          if not row or not row[0].strip().isdigit():
                              continue
                          ts = int(row[0])
                          # Binance Spot timestamps changed from ms to us on 2025-01-01.
                          if ts > 100_000_000_000_000:
                              ts //= 1000
                          dt = datetime.fromtimestamp(ts / 1000, tz=timezone.utc)
                          key = dt.strftime("%Y-%m-%d")
                          candle = [ts, float(row[1]), float(row[2]), float(row[3]),
                                    float(row[4]), float(row[5])]
                          day = days.setdefault(key, {
                              "symbol": "LTC",
                              "timeframes": {
                                  "4h": {"klines": []},
                                  "1d": {"klines": []}
                              },
                              "trades": []
                          })
                          day["timeframes"][interval]["klines"].append(candle)

          def fetch(url):
              try:
                  req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
                  with urllib.request.urlopen(req, timeout=45) as r:
                      return r.read()
              except urllib.error.HTTPError as e:
                  if e.code == 404:
                      return None
                  raise

          # Complete monthly archives from the first LTCUSDT month through last completed month.
          start = date(2017, 12, 1)
          today = datetime.now(timezone.utc).date()
          month = start
          while (month.year, month.month) < (today.year, today.month):
              ym = month.strftime("%Y-%m")
              for interval in ("4h", "1d"):
                  url = (f"https://data.binance.vision/data/spot/monthly/klines/"
                         f"LTCUSDT/{interval}/LTCUSDT-{interval}-{ym}.zip")
                  blob = fetch(url)
                  if blob:
                      add_csv_bytes(blob, interval)
                      print("Imported", interval, ym)
              if month.month == 12:
                  month = date(month.year + 1, 1, 1)
              else:
                  month = date(month.year, month.month + 1, 1)

          # Current month: daily files, through yesterday (UTC).
          d = today.replace(day=1)
          end = today - timedelta(days=1)
          while d <= end:
              ds = d.isoformat()
              for interval in ("4h", "1d"):
                  url = (f"https://data.binance.vision/data/spot/daily/klines/"
                         f"LTCUSDT/{interval}/LTCUSDT-{interval}-{ds}.zip")
                  blob = fetch(url)
                  if blob:
                      add_csv_bytes(blob, interval)
              d += timedelta(days=1)

          if not days:
              raise SystemExit("No LTCUSDT archive data was downloaded.")

          for key, payload in sorted(days.items()):
              for tf in payload["timeframes"].values():
                  tf["klines"].sort(key=lambda x: x[0])
              path = os.path.join(OUT, key + ".json")
              with open(path, "w", encoding="utf-8") as f:
                  json.dump(payload, f, separators=(",", ":"))

          print(f"Created {len(days)} daily LTC history files in {OUT}")
          PY

      - name: Commit Litecoin archive
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/history/LTC
          if git diff --cached --quiet; then
            echo "No LTC history changes."
          else
            git commit -m "Add Litecoin historical candles"
            git push
          fi
