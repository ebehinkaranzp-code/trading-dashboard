
name: Update Multi-Coin Market Data

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: update-multi-coin-market-data
  cancel-in-progress: true

jobs:
  fetch-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Collect market data
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python - <<'PY'
          import json
          import os
          import time
          import urllib.request
          import urllib.parse
          from datetime import datetime, timezone

          BINANCE = "https://fapi.binance.com"
          OKX = "https://www.okx.com"

          COINS = ["BTC", "LTC", "BCH", "UNI", "XMR"]

          def request(base, path, params=None):
              query = urllib.parse.urlencode(params or {})
              url = base + path + (("?" + query) if query else "")
              req = urllib.request.Request(
                  url,
                  headers={"User-Agent": "multi-coin-dashboard/1.0"}
              )
              with urllib.request.urlopen(req, timeout=25) as response:
                  return json.loads(response.read().decode("utf-8"))

          def safe_request(base, path, params=None):
              try:
                  return request(base, path, params)
              except Exception as exc:
                  return {"_error": str(exc)}

          def okx_data(path, params):
              result = safe_request(OKX, path, params)
              if isinstance(result, dict) and result.get("code") == "0":
                  return result.get("data", [])
              return result

          markets = {}

          for coin in COINS:
              symbol = coin + "USDT"
              inst_id = coin + "-USDT-SWAP"

              print("Collecting:", coin)

              timeframes = {}

              for tf in ("4h", "1d", "1w"):
                  result = safe_request(
                      BINANCE,
                      "/fapi/v1/klines",
                      {
                          "symbol": symbol,
                          "interval": tf,
                          "limit": 500
                      }
                  )

                  if isinstance(result, list):
                      timeframes[tf] = {"klines": result}
                  else:
                      timeframes[tf] = {
                          "klines": [],
                          "error": result.get("_error", "Unavailable")
                      }

              derivatives = {
                  "source": "OKX",
                  "instrument": inst_id,

                  "openInterest": okx_data(
                      "/api/v5/public/open-interest",
                      {
                          "instType": "SWAP",
                          "instId": inst_id
                      }
                  ),

                  "openInterestHistory": okx_data(
                      "/api/v5/rubik/stat/contracts/open-interest-history",
                      {
                          "instId": inst_id,
                          "period": "4H"
                      }
                  ),

                  "funding": okx_data(
                      "/api/v5/public/funding-rate",
                      {"instId": inst_id}
                  ),

                  "fundingHistory": okx_data(
                      "/api/v5/public/funding-rate-history",
                      {
                          "instId": inst_id,
                          "limit": "100"
                      }
                  ),

                  "longShortRatio": okx_data(
                      "/api/v5/rubik/stat/contracts/long-short-account-ratio",
                      {
                          "ccy": coin,
                          "period": "1H"
                      }
                  ),

                  "takerRatio": okx_data(
                      "/api/v5/rubik/stat/taker-volume",
                      {
                          "ccy": coin,
                          "instType": "CONTRACTS",
                          "period": "1H"
                      }
                  )
              }

              markets[coin] = {
                  "symbol": symbol,
                  "okxInstrument": inst_id,
                  "timeframes": timeframes,
                  "derivatives": derivatives
              }

              print(
                  coin,
                  "4h candles:",
                  len(timeframes["4h"].get("klines", []))
              )

              time.sleep(0.3)

          if not markets["BTC"]["timeframes"]["4h"]["klines"]:
              raise RuntimeError("BTC 4h candles unavailable")

          payload = {
              "schemaVersion": 2,
              "generatedAt": datetime.now(timezone.utc).isoformat(),
              "priceSource": "Binance USD-M Futures",
              "derivativesSource": "OKX",
              "markets": markets
          }

          os.makedirs("data", exist_ok=True)

          with open("data/markets.json", "w", encoding="utf-8") as f:
              json.dump(
                  payload,
                  f,
                  ensure_ascii=False,
                  separators=(",", ":")
              )

          print("Generated data/markets.json")

          for coin, item in markets.items():
              print(
                  coin,
                  "4h:",
                  len(item["timeframes"]["4h"].get("klines", [])),
                  "OI:",
                  len(item["derivatives"].get("openInterestHistory", [])),
                  "Funding:",
                  len(item["derivatives"].get("fundingHistory", [])),
                  "Long/Short:",
                  len(item["derivatives"].get("longShortRatio", [])),
                  "Taker:",
                  len(item["derivatives"].get("takerRatio", []))
              )
          PY

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/markets.json

          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "Update multi-coin market data"
            git push
          fi
