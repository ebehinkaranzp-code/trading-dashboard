
name: Update Multi-Coin Market Data

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: update-multi-coin-market-data
  cancel-in-progress: true

jobs:
  fetch-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Collect market data
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python - <<'PY'
          import json
          import os
          import time
          import urllib.request
          import urllib.parse
          import urllib.error
          from datetime import datetime, timezone

          OKX = "https://www.okx.com"
          COINS = ["BTC", "LTC", "BCH", "UNI", "XMR"]

          TIMEFRAMES = {
              "4h": "4H",
              "1d": "1Dutc",
              "1w": "1Wutc"
          }

          def request(path, params=None):
              query = urllib.parse.urlencode(params or {})
              url = OKX + path + ("?" + query if query else "")

              req = urllib.request.Request(
                  url,
                  headers={
                      "User-Agent": "multi-coin-dashboard/3.0",
                      "Accept": "application/json"
                  }
              )

              with urllib.request.urlopen(req, timeout=25) as response:
                  return json.loads(
                      response.read().decode("utf-8")
                  )

          def safe_request(path, params=None):
              try:
                  return request(path, params)
              except urllib.error.HTTPError as exc:
                  try:
                      body = exc.read().decode("utf-8")[:500]
                  except Exception:
                      body = ""
                  return {
                      "_error": f"HTTP {exc.code}: {body}"
                  }
              except Exception as exc:
                  return {
                      "_error": f"{type(exc).__name__}: {exc}"
                  }

          def get_klines(coin, timeframe, bar):
              errors = []

              candidates = [
                  (coin + "-USDT-SWAP", "SWAP"),
                  (coin + "-USDT", "SPOT")
              ]

              for inst_id, market_type in candidates:

                  result = safe_request(
                      "/api/v5/market/candles",
                      {
                          "instId": inst_id,
                          "bar": bar,
                          "limit": "300"
                      }
                  )

                  if not isinstance(result, dict):
                      errors.append(
                          f"{inst_id}: Invalid response"
                      )
                      continue

                  if result.get("code") != "0":
                      errors.append(
                          f"{inst_id}: "
                          + str(result.get("msg", result))
                      )
                      continue

                  raw = result.get("data", [])

                  valid = [
                      row for row in raw
                      if isinstance(row, list)
                      and len(row) >= 9
                      and str(row[8]) == "1"
                  ]

                  if valid:
                      valid.sort(key=lambda row: int(row[0]))

                      unique = []
                      seen = set()

                      for row in valid:
                          timestamp = str(row[0])

                          if timestamp not in seen:
                              seen.add(timestamp)
                              unique.append(row)

                      print(
                          f"{coin} {timeframe}: "
                          f"{len(unique)} candles "
                          f"from OKX {market_type}"
                      )

                      return {
                          "klines": unique,
                          "source": "OKX",
                          "marketType": market_type,
                          "instrument": inst_id
                      }

                  errors.append(
                      f"{inst_id}: No completed candles"
                  )

                  time.sleep(0.2)

              print(
                  f"FAILED {coin} {timeframe}: "
                  + " | ".join(errors)
              )

              return {
                  "klines": [],
                  "source": "OKX",
                  "error": " | ".join(errors)
              }

          def okx_data(path, params):
              result = safe_request(path, params)

              if (
                  isinstance(result, dict)
                  and result.get("code") == "0"
              ):
                  return result.get("data", [])

              print(
                  "OKX API error:",
                  path,
                  result
              )

              return []

          markets = {}

          for coin in COINS:

              print("\nCollecting:", coin)

              swap_id = coin + "-USDT-SWAP"

              timeframes = {}

              for name, bar in TIMEFRAMES.items():

                  timeframes[name] = get_klines(
                      coin,
                      name,
                      bar
                  )

                  time.sleep(0.2)

              derivatives = {
                  "source": "OKX",
                  "instrument": swap_id,

                  "openInterest": okx_data(
                      "/api/v5/public/open-interest",
                      {
                          "instType": "SWAP",
                          "instId": swap_id
                      }
                  ),

                  "openInterestHistory": okx_data(
                      "/api/v5/rubik/stat/contracts/open-interest-history",
                      {
                          "instId": swap_id,
                          "period": "4H"
                      }
                  ),

                  "funding": okx_data(
                      "/api/v5/public/funding-rate",
                      {
                          "instId": swap_id
                      }
                  ),

                  "fundingHistory": okx_data(
                      "/api/v5/public/funding-rate-history",
                      {
                          "instId": swap_id,
                          "limit": "100"
                      }
                  ),

                  "longShortRatio": okx_data(
                      "/api/v5/rubik/stat/contracts/long-short-account-ratio",
                      {
                          "ccy": coin,
                          "period": "1H"
                      }
                  ),

                  "takerRatio": okx_data(
                      "/api/v5/rubik/stat/taker-volume",
                      {
                          "ccy": coin,
                          "instType": "CONTRACTS",
                          "period": "1H"
                      }
                  )
              }

              markets[coin] = {
                  "symbol": coin + "USDT",
                  "okxInstrument": swap_id,
                  "timeframes": timeframes,
                  "derivatives": derivatives
              }

              print(
                  coin,
                  "4h candles:",
                  len(timeframes["4h"]["klines"])
              )

              time.sleep(0.5)

          btc_count = len(
              markets["BTC"]["timeframes"]["4h"]["klines"]
          )

          if btc_count == 0:
              raise RuntimeError(
                  "BTC 4h candles unavailable from OKX"
              )

          payload = {
              "schemaVersion": 3,
              "generatedAt": datetime.now(
                  timezone.utc
              ).isoformat(),

              "priceSource": "OKX",
              "derivativesSource": "OKX",

              "markets": markets
          }

          os.makedirs("data", exist_ok=True)

          with open(
              "data/markets.json",
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  payload,
                  f,
                  ensure_ascii=False,
                  separators=(",", ":")
              )

          print("\nGenerated data/markets.json")

          for coin, item in markets.items():

              print(
                  coin,
                  "4h:",
                  len(item["timeframes"]["4h"]["klines"]),
                  "1d:",
                  len(item["timeframes"]["1d"]["klines"]),
                  "1w:",
                  len(item["timeframes"]["1w"]["klines"]),
                  "OI:",
                  len(item["derivatives"]["openInterestHistory"]),
                  "Funding:",
                  len(item["derivatives"]["fundingHistory"]),
                  "Long/Short:",
                  len(item["derivatives"]["longShortRatio"]),
                  "Taker:",
                  len(item["derivatives"]["takerRatio"])
              )

          PY

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/markets.json

          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "Update multi-coin market data"
            git push
          fi
