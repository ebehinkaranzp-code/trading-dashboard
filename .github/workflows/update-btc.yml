name: Update BTC Data

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write
concurrency:
  group: update-btc-data
  cancel-in-progress: true
jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install requests
        run: pip install requests

      - name: Fetch OKX data
        run: |
          python - <<'PY'
          import requests, json, datetime, os

          BASE = "https://www.okx.com"
          INST = "BTC-USDT-SWAP"

          session = requests.Session()
          session.headers.update({
              "User-Agent": "BTC-Dashboard/1.0"
          })

          def get(path, params=None):
              r = session.get(
                  BASE + path,
                  params=params,
                  timeout=25
              )
              r.raise_for_status()
              result = r.json()

              if result.get("code") != "0":
                  raise Exception(result.get("msg", "OKX API error"))

              return result.get("data", [])

          def safe(path, params=None):
              try:
                  return get(path, params)
              except Exception as e:
                  return {"_error": str(e)}

          data = {
              "schemaVersion": 1,
              "generatedAt": datetime.datetime.now(
                  datetime.timezone.utc
              ).isoformat(),
              "source": "OKX API",
              "symbol": "BTC-USDT-SWAP",
              "timeframes": {},
              "derivatives": {}
          }

          for tf, bar in [
              ("4h", "4H"),
              ("1d", "1Dutc"),
              ("1w", "1Wutc")
          ]:
              data["timeframes"][tf] = safe(
                  "/api/v5/market/candles",
                  {
                      "instId": INST,
                      "bar": bar,
                      "limit": "300"
                  }
              )

          data["derivatives"]["openInterest"] = safe(
              "/api/v5/public/open-interest",
              {
                  "instType": "SWAP",
                  "instId": INST
              }
          )

          data["derivatives"]["funding"] = safe(
              "/api/v5/public/funding-rate",
              {"instId": INST}
          )

          data["derivatives"]["fundingHistory"] = safe(
              "/api/v5/public/funding-rate-history",
              {
                  "instId": INST,
                  "limit": "30"
              }
          )

          data["derivatives"]["openInterestHistory"] = safe(
              "/api/v5/rubik/stat/contracts/open-interest-history",
              {
                  "ccy": "BTC",
                  "instType": "SWAP",
                  "period": "4H",
                  "limit": "30"
              }
          )

          data["derivatives"]["longShortRatio"] = safe(
              "/api/v5/rubik/stat/contracts/long-short-account-ratio",
              {
                  "ccy": "BTC",
                  "period": "4H"
              }
          )

          data["derivatives"]["takerRatio"] = safe(
              "/api/v5/rubik/stat/taker-volume",
              {
                  "ccy": "BTC",
                  "period": "4H"
              }
          )

          os.makedirs("data", exist_ok=True)

          with open("data/btc.json", "w") as f:
              json.dump(data, f, separators=(",", ":"))

          print("OKX data collection completed")
          print("Generated:", data["generatedAt"])
          PY

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/btc.json
          git diff --cached --quiet || git commit -m "Update BTC market data"
          git pull --rebase origin main
          git push
