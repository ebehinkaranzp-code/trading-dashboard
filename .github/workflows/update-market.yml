name: Update Market Data

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: update-market-data
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch market data and record diagnostics
        run: |
          python - <<'PY'
          import json, os, time, tempfile, urllib.request, urllib.parse
          from datetime import datetime, timezone

          BASE = "https://www.okx.com"
          COINS = {
              "BTC": "BTC-USDT",
              "ETH": "ETH-USDT",
              "LTC": "LTC-USDT",
              "BCH": "BCH-USDT",
              "UNI": "UNI-USDT",
          }
          TIMEFRAMES = {"4h": "4H", "1d": "1D", "1w": "1W"}
          DIAG_PATH = "data/market-diagnostics.json"
          MAX_EVENTS = 200
          KEEP_DAYS = 30

          def now_ms():
              return int(time.time() * 1000)

          def iso_now():
              return datetime.now(timezone.utc).isoformat()

          def load_diagnostics():
              try:
                  with open(DIAG_PATH, encoding="utf-8") as f:
                      d = json.load(f)
                  if not isinstance(d, dict):
                      raise ValueError("diagnostics root must be an object")
              except (FileNotFoundError, json.JSONDecodeError, ValueError):
                  d = {"schemaVersion": 1, "events": [], "droppedEvents": 0}
              d.setdefault("events", [])
              d.setdefault("droppedEvents", 0)
              return d

          diagnostics = load_diagnostics()

          def record(endpoint, ok, code=None, message=None):
              stamp = now_ms()
              event = {
                  "timestamp": datetime.fromtimestamp(stamp / 1000, timezone.utc).isoformat(),
                  "endpoint": endpoint,
                  "status": "success" if ok else "error",
                  "errorCode": None if ok else code,
                  "message": None if ok else str(message)[:1000],
              }
              if not ok:
                  events = diagnostics["events"]
                  # Combine repeated errors for the same endpoint/code in a 5-minute window.
                  bucket = stamp // 300000
                  match = next((x for x in reversed(events)
                                if x.get("endpoint") == endpoint
                                and x.get("errorCode") == code
                                and x.get("bucket") == bucket), None)
                  if match:
                      match["count"] = match.get("count", 1) + 1
                      match["timestamp"] = event["timestamp"]
                      match["message"] = event["message"]
                  else:
                      event["bucket"] = bucket
                      event["count"] = 1
                      events.append(event)
                      if len(events) > MAX_EVENTS:
                          removed = events.pop(0)
                          diagnostics["droppedEvents"] += removed.get("count", 1)

          def get(path, params, required=False):
              query = urllib.parse.urlencode(params)
              endpoint = path + ("?" + query if query else "")
              url = BASE + endpoint
              try:
                  req = urllib.request.Request(url, headers={"User-Agent": "TradingDashboard/2.0"})
                  with urllib.request.urlopen(req, timeout=20) as response:
                      body = json.loads(response.read().decode("utf-8"))
                  if body.get("code") != "0":
                      raise RuntimeError(f"OKX {body.get('code')}: {body.get('msg', 'API error')}")
                  rows = body.get("data", [])
                  record(endpoint, True)
                  return rows
              except Exception as exc:
                  code = getattr(exc, "code", None)
                  record(endpoint, False, str(code) if code else type(exc).__name__, str(exc))
                  print(f"API ERROR {endpoint}: {exc}")
                  if required:
                      raise
                  return []

          markets = {}
          for coin, symbol in COINS.items():
              print("Fetching", coin, symbol)
              timeframes = {}
              for label, interval in TIMEFRAMES.items():
                  rows = get("/api/v5/market/history-candles",
                             {"instId": symbol, "bar": interval, "limit": "300"},
                             required=True)
                  # OKX returns newest-first; dashboard expects oldest-first.
                  rows = list(reversed(rows))
                  timeframes[label] = {"klines": rows}

              swap = coin + "-USDT-SWAP"
              derivatives = {
                  "openInterest": get("/api/v5/public/open-interest", {"instId": swap}),
                  "openInterestHistory": get(
                      "/api/v5/rubik/stat/contracts/open-interest-history",
                      {"instId": swap, "period": "4H", "limit": "100"}),
                  "funding": get("/api/v5/public/funding-rate", {"instId": swap}),
                  "fundingHistory": get(
                      "/api/v5/public/funding-rate-history", {"instId": swap, "limit": "100"}),
                  "longShortRatio": get(
                      "/api/v5/rubik/stat/contracts/long-short-account-ratio",
                      {"ccy": coin, "period": "4H", "limit": "100"}),
                  "takerRatio": get(
                      "/api/v5/rubik/stat/taker-volume",
                      {"ccy": coin, "instType": "CONTRACTS", "period": "4H", "limit": "100"}),
              }
              markets[coin] = {
                  "symbol": symbol,
                  "okxInstrument": symbol,
                  "source": "OKX",
                  "timeframes": timeframes,
                  "derivatives": derivatives,
              }

          # Prune diagnostic events older than 30 days.
          cutoff = now_ms() - KEEP_DAYS * 86400000
          diagnostics["events"] = [
              e for e in diagnostics["events"]
              if int(datetime.fromisoformat(e["timestamp"].replace("Z", "+00:00")).timestamp() * 1000) >= cutoff
          ]
          diagnostics["generatedAt"] = iso_now()
          diagnostics["eventCount"] = len(diagnostics["events"])

          output = {
              "schemaVersion": 2,
              "generatedAt": iso_now(),
              "priceSource": "OKX spot candles",
              "derivativesSource": "OKX derivatives; unavailable endpoints are recorded in market-diagnostics.json",
              "source": "OKX",
              "diagnostics": {
                  "file": "data/market-diagnostics.json",
                  "eventCount": diagnostics["eventCount"],
                  "droppedEvents": diagnostics["droppedEvents"],
                  "hasErrors": any(e.get("status") == "error" for e in diagnostics["events"]),
                  "recentEvents": diagnostics["events"][-20:],
              },
              "markets": markets,
          }

          os.makedirs("data", exist_ok=True)
          def atomic_json(path, value):
              directory = os.path.dirname(path) or "."
              fd, tmp = tempfile.mkstemp(prefix=".tmp-", dir=directory)
              try:
                  with os.fdopen(fd, "w", encoding="utf-8") as f:
                      json.dump(value, f, ensure_ascii=False, separators=(",", ":"))
                      f.write("\n")
                  os.replace(tmp, path)
              except Exception:
                  if os.path.exists(tmp):
                      os.remove(tmp)
                  raise

          atomic_json(DIAG_PATH, diagnostics)
          atomic_json("data/markets.json", output)
          print("Market data updated:", ", ".join(markets))
          print("Diagnostic error events:", diagnostics["eventCount"])
          PY

      - name: Commit market data and diagnostics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/markets.json data/market-diagnostics.json
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "Update market data and API diagnostics"
            git push
          fi
