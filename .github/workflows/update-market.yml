name: Market Data Archive

on:
  workflow_dispatch:
  schedule:
    # GitHub Actions scheduled workflows run in UTC. 15 minutes limits
    # unnecessary repository commits; the dashboard still gets live data
    # exclusively from the published GitHub JSON archive in the browser.
    - cron: '*/15 * * * *'

permissions:
  contents: write

concurrency:
  group: trading-data-archive-main
  queue: max

jobs:
  update:
    name: Fetch, validate and archive public market data
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch and publish data
        env:
          PYTHONUNBUFFERED: '1'
        run: |
          python - <<'PY'
          import json, os, time, tempfile, urllib.parse, urllib.request
          from datetime import datetime, timezone

          BASE = 'https://www.okx.com'
          # This workflow is the OKX Perpetual source. Do not silently fall
          # back to spot symbols: the dashboard expects *-USDT-SWAP here.
          COINS = {
              'BTC': ['BTC-USDT-SWAP'],
              'ETH': ['ETH-USDT-SWAP'],
              'LTC': ['LTC-USDT-SWAP'],
              'BCH': ['BCH-USDT-SWAP'],
              'UNI': ['UNI-USDT-SWAP'],
              'GOLD': ['XAU-USDT-SWAP'],
          }
          DECISION_TF = {'15m': '15m', '1h': '1H', '4h': '4H', '12h': '12H', '1d': '1D', '1w': '1W'}
          ARCHIVE_TF = {'1m': '1m', '5m': '5m', '15m': '15m'}
          errors, checks, symbol_errors, markets = [], {}, {}, {}
          now = datetime.now(timezone.utc)
          generated = now.isoformat(timespec='seconds').replace('+00:00', 'Z')
          day = now.strftime('%Y-%m-%d')

          def atomic_json(path, value):
              os.makedirs(os.path.dirname(path) or '.', exist_ok=True)
              fd, tmp = tempfile.mkstemp(prefix='.tmp-', dir=os.path.dirname(path) or '.')
              try:
                  with os.fdopen(fd, 'w', encoding='utf-8') as f:
                      json.dump(value, f, ensure_ascii=False, separators=(',', ':'))
                      f.write('\n')
                  os.replace(tmp, path)
              except Exception:
                  if os.path.exists(tmp): os.remove(tmp)
                  raise

          def request(path, params):
              query = urllib.parse.urlencode(params)
              endpoint = path + '?' + query
              last = None
              for attempt in range(3):
                  try:
                      req = urllib.request.Request(
                          BASE + endpoint,
                          headers={'User-Agent': 'TradingDashboard-MarketArchive/3.0',
                                   'Accept': 'application/json'})
                      with urllib.request.urlopen(req, timeout=20) as response:
                          payload = json.loads(response.read().decode('utf-8'))
                      if payload.get('code') != '0':
                          raise RuntimeError('OKX ' + str(payload.get('code')) + ': ' + str(payload.get('msg')))
                      rows = payload.get('data', [])
                      checks[endpoint] = {'status': 'success', 'records': len(rows) if isinstance(rows, list) else 0}
                      return rows if isinstance(rows, list) else []
                  except Exception as exc:
                      last = str(exc)
                      if attempt < 2: time.sleep(1.5 * (attempt + 1))
              checks[endpoint] = {'status': 'error', 'message': last}
              errors.append({'endpoint': endpoint, 'error': last})
              print('API ERROR', endpoint, last)
              return []

          def clean_candles(rows):
              out, seen = [], set()
              for row in rows or []:
                  if not isinstance(row, list) or len(row) < 9 or str(row[8]) != '1':
                      continue  # never archive the still-forming candle
                  try:
                      ts, op, hi, lo, cl = map(float, row[:5])
                      vol = float(row[7] if row[7] not in ('', None) else row[6])
                      if not (ts > 0 and min(op, hi, lo, cl) > 0 and vol >= 0): continue
                      if hi < max(op, cl) or lo > min(op, cl) or hi < lo: continue
                      key = str(int(ts))
                      if key not in seen:
                          seen.add(key); out.append(row)
                  except (TypeError, ValueError):
                      continue
              return sorted(out, key=lambda x: int(x[0]))

          def fetch_candles(inst, bar, limit='300'):
              best = []
              for endpoint in ('/api/v5/market/candles', '/api/v5/market/history-candles'):
                  rows = clean_candles(request(endpoint, {'instId': inst, 'bar': bar, 'limit': limit}))
                  if len(rows) > len(best): best = rows
                  if len(best) >= 30: break
              return best

          def read_json(path, default):
              try:
                  with open(path, encoding='utf-8') as f: return json.load(f)
              except Exception: return default

          old_payload = read_json('data/markets.json', {})
          old_markets = old_payload.get('markets', {}) or {}
          trade_cursor_path = 'data/okx-trade-cursors.json'
          trade_cursors = read_json(trade_cursor_path, {})

          for coin, candidates in COINS.items():
              chosen, selected = None, None
              for inst in candidates:
                  frames = {label: {'klines': fetch_candles(inst, bar)}
                            for label, bar in DECISION_TF.items()}
                  if len(frames['4h']['klines']) >= 30:
                      chosen, selected = inst, frames
                      break
              if not chosen:
                  reason = 'No valid 4H candle set (minimum 30 confirmed candles)'
                  symbol_errors[coin] = reason
                  previous = old_markets.get(coin)
                  if previous:
                      previous = dict(previous)
                      previous.update({'dataStatus': 'stale', 'fetchError': reason,
                                       'lastSuccessfulAt': previous.get('updatedAt')})
                      markets[coin] = previous
                  continue

              # Rolling daily archive: merge by candle timestamp, never duplicate.
              archive_path = f'data/history/{coin}/{day}.json'
              archive = read_json(archive_path, {
                  'schemaVersion': 1, 'symbol': chosen, 'date': day,
                  'source': 'OKX confirmed public perpetual candles',
                  'timeframes': {'1m': [], '5m': [], '15m': []}, 'trades': []})
              # Never mix a prior spot fallback archive with perpetual data.
              if archive.get('symbol') != chosen:
                  archive = {
                      'schemaVersion': 1, 'symbol': chosen, 'date': day,
                      'source': 'OKX confirmed public perpetual candles',
                      'timeframes': {'1m': [], '5m': [], '15m': []},
                      'trades': []
                  }
              archive.setdefault('timeframes', {})
              archive_counts = {}
              for label, bar in ARCHIVE_TF.items():
                  fresh = fetch_candles(chosen, bar, '300')
                  by_ts = {str(int(r[0])): r for r in archive['timeframes'].get(label, [])
                           if isinstance(r, list) and r}
                  for row in fresh: by_ts[str(int(row[0]))] = row
                  merged = sorted(by_ts.values(), key=lambda r: int(r[0]))
                  # Keep a bounded rolling daily file. 1m retains up to 24h+ overlap.
                  archive['timeframes'][label] = merged[-20000:]
                  archive_counts[label] = len(archive['timeframes'][label])
              # Capture real public taker-side trades for Footprint/Delta.
              # OKX history-trades supports pagination by tradeId. Pull pages
              # newer than the saved cursor, with a hard page cap per run.
              archive.setdefault('trades', [])
              cursor = trade_cursors.get(coin)
              fetched_trades, page_cursor = [], cursor
              max_pages = 20
              for page_no in range(max_pages):
                  params = {'instId': chosen, 'limit': '100'}
                  if page_cursor is not None:
                      params['before'] = str(page_cursor)
                  rows = request('/api/v5/market/history-trades', params)
                  if not rows:
                      break
                  valid_rows = []
                  for row in rows:
                      try:
                          trade_id = str(row['tradeId'])
                          ts = int(row['ts'])
                          px = float(row['px'])
                          sz = float(row['sz'])
                          side = str(row['side']).lower()
                          if ts > 0 and px > 0 and sz > 0 and side in ('buy', 'sell'):
                              valid_rows.append({
                                  'tradeId': trade_id, 'ts': ts,
                                  'px': px, 'sz': sz, 'side': side
                              })
                      except (KeyError, TypeError, ValueError):
                          continue
                  if not valid_rows:
                      break
                  fetched_trades.extend(valid_rows)
                  # OKX returns newest first. Move the before cursor to the
                  # newest ID in this page to walk forward toward current time.
                  try:
                      newest_id = max(int(x['tradeId']) for x in valid_rows)
                  except ValueError:
                      break
                  if page_cursor is not None and newest_id <= int(page_cursor):
                      break
                  page_cursor = str(newest_id)
                  if len(rows) < 100:
                      break
              if page_cursor is not None:
                  trade_cursors[coin] = str(page_cursor)

              by_trade_id = {
                  str(x.get('tradeId')): x
                  for x in archive.get('trades', [])
                  if isinstance(x, dict) and x.get('tradeId') is not None
              }
              for trade in fetched_trades:
                  by_trade_id[trade['tradeId']] = trade
              trade_cutoff = int((now.timestamp() - 6 * 3600) * 1000)
              merged_trades = [
                  x for x in by_trade_id.values()
                  if int(x.get('ts', 0)) >= trade_cutoff
              ]
              merged_trades.sort(key=lambda x: int(x.get('ts', 0)))
              archive['trades'] = merged_trades[-6000:]
              archive['tradeCapture'] = (
                  'OKX public history-trades; incremental tradeId pagination; '
                  'partial rolling sample capped at 6000 trades and six hours'
              )
              archive['tradeCaptureStatus'] = (
                  'active' if fetched_trades else 'no_new_trades_or_api_error'
              )
              archive.update({'symbol': chosen, 'updatedAt': generated})
              atomic_json(archive_path, archive)
              atomic_json(trade_cursor_path, trade_cursors)

              swap = chosen
              derivatives = {
                  'source': 'OKX', 'instrument': swap,
                  'openInterest': request('/api/v5/public/open-interest', {'instType': 'SWAP', 'instId': swap}),
                  'funding': request('/api/v5/public/funding-rate', {'instId': swap}),
                  'fundingHistory': request('/api/v5/public/funding-rate-history', {'instId': swap, 'limit': '100'}),
              }
              ticker_rows = request('/api/v5/market/ticker', {'instId': chosen})
              ticker_row = ticker_rows[0] if ticker_rows else {}
              try:
                  last_price = float(ticker_row.get('last', 0) or 0)
                  open_24h = float(ticker_row.get('open24h', 0) or 0)
                  ticker = {
                      'last': last_price,
                      'change24h': ((last_price / open_24h) - 1) * 100 if last_price > 0 and open_24h > 0 else None,
                      'volume24h': float(ticker_row.get('vol24h', 0) or 0),
                      'bid': float(ticker_row.get('bidPx', 0) or 0),
                      'ask': float(ticker_row.get('askPx', 0) or 0),
                      'time': generated,
                  } if last_price > 0 else None
              except (TypeError, ValueError):
                  ticker = None

              book_rows = request('/api/v5/market/books', {'instId': chosen, 'sz': '20'})
              book_row = book_rows[0] if book_rows else {}
              order_book = {
                  'bids': [{'price': float(x[0]), 'size': float(x[1])} for x in book_row.get('bids', []) if len(x) >= 2],
                  'asks': [{'price': float(x[0]), 'size': float(x[1])} for x in book_row.get('asks', []) if len(x) >= 2],
                  'time': generated,
              }
              if coin != 'GOLD':
                  derivatives['longShortRatio'] = request('/api/v5/rubik/stat/contracts/long-short-account-ratio', {'ccy': coin, 'period': '1H'})
                  derivatives['takerRatio'] = request('/api/v5/rubik/stat/taker-volume', {'ccy': coin, 'instType': 'CONTRACTS', 'period': '1H'})
              else:
                  derivatives['longShortRatio'] = []
                  derivatives['takerRatio'] = []

              markets[coin] = {
                  'symbol': chosen, 'okxInstrument': chosen, 'source': 'OKX',
                  'updatedAt': generated, 'dataStatus': 'fresh',
                  'timeframes': selected, 'derivatives': derivatives,
                  'ticker': ticker, 'orderBook': order_book,
                  'archive': {'date': day, 'timeframes': archive_counts}
              }
              print(f'{coin}: {chosen}; 15m={len(selected["15m"]["klines"])}; 1H={len(selected["1h"]["klines"])}; 4H={len(selected["4h"]["klines"])}; 12H={len(selected["12h"]["klines"])}; 1D={len(selected["1d"]["klines"])}; archive={archive_counts}')

          if 'GOLD' in markets: markets['XAU'] = markets['GOLD']
          btc = markets.get('BTC')
          if not btc or len(btc.get('timeframes', {}).get('4h', {}).get('klines', [])) < 30:
              raise SystemExit('CRITICAL: BTC 4H validation failed. Existing published market files were not replaced.')

          status = 'partial' if symbol_errors or errors else 'success'
          output = {
              'schemaVersion': 3, 'generatedAt': generated,
              'source': 'OKX', 'priceSource': 'OKX public market candles',
              'derivativesSource': 'OKX public derivatives endpoints',
              'markets': markets,
              'fetchStatus': {'status': status, 'availableMarkets': list(markets),
                              'symbolErrors': symbol_errors, 'apiErrorCount': len(errors)}
          }
          diagnostics = {'schemaVersion': 2, 'generatedAt': generated,
                         'checks': checks, 'errors': errors,
                         'symbolErrors': symbol_errors,
                         'availableMarkets': list(markets)}
          atomic_json('data/markets.json', output)
          atomic_json('data/market-diagnostics.json', diagnostics)
          atomic_json('data/fetch-status.json', {
              'time': generated, 'status': status,
              'markets': list(markets), 'symbolErrors': symbol_errors,
              'errors': errors})

          # Keep the legacy BTC endpoint in sync for older dashboard modules.
          atomic_json('data/btc.json', {
              'schemaVersion': 2, 'generatedAt': generated, 'source': 'OKX',
              'symbol': btc['symbol'], 'timeframes': btc['timeframes'],
              'derivatives': btc.get('derivatives', {})})
          print('Published markets:', ', '.join(markets))
          print('Overall status:', status, '| API errors:', len(errors))
          PY

      - name: Validate JSON and required BTC history
        run: |
          python - <<'PY'
          import json, os
          required = ['data/markets.json', 'data/market-diagnostics.json',
                      'data/fetch-status.json', 'data/btc.json']
          for path in required:
              if not os.path.isfile(path): raise SystemExit('Missing: ' + path)
              with open(path, encoding='utf-8') as f: json.load(f)
          with open('data/markets.json', encoding='utf-8') as f: payload = json.load(f)
          btc = payload.get('markets', {}).get('BTC', {})
          candles = btc.get('timeframes', {}).get('4h', {}).get('klines', [])
          if len(candles) < 30: raise SystemExit('BTC 4H has fewer than 30 confirmed candles')
          for tf in ('15m', '1h', '12h', '1d'):
              rows = btc.get('timeframes', {}).get(tf, {}).get('klines', [])
              if len(rows) < 30: raise SystemExit(f'BTC {tf} has fewer than 30 confirmed candles')
          if btc.get('dataStatus') == 'stale': raise SystemExit('BTC data is stale')
          from datetime import datetime, timezone
          day = datetime.now(timezone.utc).strftime('%Y-%m-%d')
          for asset, market in payload.get('markets', {}).items():
              if asset == 'XAU' and 'GOLD' in payload.get('markets', {}):
                  continue
              path = f'data/history/{asset}/{day}.json'
              if not os.path.isfile(path):
                  raise SystemExit('Missing daily archive: ' + path)
              with open(path, encoding='utf-8') as f: archive = json.load(f)
              if archive.get('symbol') != market.get('symbol'):
                  raise SystemExit('Daily archive symbol mismatch: ' + path)
              if not isinstance(archive.get('trades'), list):
                  raise SystemExit('Daily archive trades field missing: ' + path)
              for trade in archive['trades']:
                  if not all(k in trade for k in ('tradeId', 'ts', 'px', 'sz', 'side')):
                      raise SystemExit('Invalid archived trade record: ' + path)
          print('Validation passed. BTC confirmed 4H candles:', len(candles))
          print('Markets:', ', '.join(payload.get('markets', {}).keys()))
          PY

      - name: Commit only changed data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/markets.json data/btc.json data/fetch-status.json data/market-diagnostics.json data/history/ data/okx-trade-cursors.json
          if git diff --cached --quiet; then
            echo 'No data changes; skipping commit.'
          else
            git commit -m "chore(data): refresh market archive [skip ci]"
            # Another archive workflow may have pushed while this job was fetching.
            # Rebase this data-only commit onto the latest main and retry safely.
            for attempt in 1 2 3 4 5; do
              git fetch origin main
              if ! git rebase origin/main; then
                git rebase --abort || true
                echo 'Rebase conflict: archive files changed remotely; retrying from refreshed main.'
                git reset --hard origin/main
                # Re-apply only this workflow's freshly generated archive files
                # from the pre-rebase commit is handled by the next run; do not
                # force-push or overwrite remote data.
                exit 1
              fi
              if git push origin HEAD:main; then
                echo 'Archive commit published.'
                exit 0
              fi
              echo "Push race detected (attempt ${attempt}/5); retrying..."
              sleep $((attempt * 2))
            done
            echo 'Unable to publish after five retries.'
            exit 1
          fi
