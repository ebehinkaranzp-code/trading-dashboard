name: Update Market Data

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: update-market-data
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch market data
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python - <<'PY'
          import json, os, time, tempfile, urllib.request, urllib.parse
          from datetime import datetime, timezone

          BASE = "https://www.okx.com"
          COINS = {
              "BTC": "BTC-USDT",
              "ETH": "ETH-USDT",
              "LTC": "LTC-USDT",
              "BCH": "BCH-USDT",
              "UNI": "UNI-USDT",
          }
          TIMEFRAMES = {"4h": "4H", "1d": "1D", "1w": "1W"}
          errors = []
          checks = {}

          def iso_now():
              return datetime.now(timezone.utc).isoformat()

          def get(path, params=None):
              query = urllib.parse.urlencode(params or {})
              endpoint = path + ("?" + query if query else "")
              url = BASE + endpoint
              try:
                  req = urllib.request.Request(
                      url, headers={"User-Agent": "TradingDashboard/3.0"}
                  )
                  with urllib.request.urlopen(req, timeout=25) as response:
                      body = json.loads(response.read().decode("utf-8"))
                  if body.get("code") != "0":
                      raise RuntimeError(
                          "OKX " + str(body.get("code")) + ": " + str(body.get("msg"))
                      )
                  rows = body.get("data", [])
                  checks[endpoint] = {
                      "status": "success",
                      "records": len(rows) if isinstance(rows, list) else 1
                  }
                  return rows if isinstance(rows, list) else []
              except Exception as exc:
                  message = str(exc)
                  checks[endpoint] = {"status": "error", "message": message}
                  errors.append({"endpoint": endpoint, "error": message})
                  print("API ERROR:", endpoint, message)
                  return []

          def valid_candles(rows):
              valid = []
              for row in rows:
                  if not isinstance(row, list) or len(row) < 9 or str(row[8]) != "1":
                      continue
                  try:
                      ts, op, hi, lo, cl = map(float, row[:5])
                      vol = float(row[7] if row[7] not in ("", None) else row[6])
                      if (ts > 0 and op > 0 and hi > 0 and lo > 0 and cl > 0
                          and vol >= 0 and hi >= max(op, cl)
                          and lo <= min(op, cl) and hi >= lo):
                          valid.append(row)
                  except (TypeError, ValueError):
                      continue
              # Oldest first; remove duplicate timestamps.
              valid.sort(key=lambda x: int(x[0]))
              unique = []
              seen = set()
              for row in valid:
                  stamp = str(row[0])
                  if stamp not in seen:
                      unique.append(row)
                      seen.add(stamp)
              return unique

          markets = {}
          symbol_errors = {}

          for coin, spot_symbol in COINS.items():
              print("Fetching", coin, spot_symbol)
              timeframes = {}
              for label, interval in TIMEFRAMES.items():
                  rows = get("/api/v5/market/history-candles", {
                      "instId": spot_symbol, "bar": interval, "limit": "300"
                  })
                  candles = valid_candles(rows)
                  timeframes[label] = {"klines": candles}
                  print(coin, label, "valid candles:", len(candles))
                  if label == "4h" and len(candles) < 30:
                      symbol_errors.setdefault(coin, []).append(
                          "کمتر از ۳۰ کندل معتبر 4H دریافت شد"
                      )

              # A failed symbol must not prevent other symbols from updating.
              if len(timeframes["4h"]["klines"]) < 30:
                  continue

              swap = coin + "-USDT-SWAP"
              derivatives = {
                  "source": "OKX",
                  "instrument": swap,
                  "openInterest": get("/api/v5/public/open-interest", {
                      "instType": "SWAP", "instId": swap
                  }),
                  "openInterestHistory": get(
                      "/api/v5/rubik/stat/contracts/open-interest-history",
                      {"instId": swap, "period": "4H", "limit": "100"}
                  ),
                  "funding": get("/api/v5/public/funding-rate", {"instId": swap}),
                  "fundingHistory": get(
                      "/api/v5/public/funding-rate-history",
                      {"instId": swap, "limit": "100"}
                  ),
                  "longShortRatio": get(
                      "/api/v5/rubik/stat/contracts/long-short-account-ratio",
                      {"ccy": coin, "period": "1H"}
                  ),
                  "takerRatio": get(
                      "/api/v5/rubik/stat/taker-volume",
                      {"ccy": coin, "instType": "CONTRACTS", "period": "1H"}
                  ),
              }

              markets[coin] = {
                  "symbol": spot_symbol,
                  "okxInstrument": spot_symbol,
                  "source": "OKX",
                  "timeframes": timeframes,
                  "derivatives": derivatives,
              }

          # BTC is the dashboard's required baseline. Never publish an empty BTC payload.
          if "BTC" not in markets:
              raise SystemExit("BTC 4H data unavailable or invalid; existing markets.json preserved.")

          generated = iso_now()
          output = {
              "schemaVersion": 3,
              "generatedAt": generated,
              "priceSource": "OKX spot history candles",
              "derivativesSource": "OKX public derivatives endpoints",
              "source": "OKX",
              "markets": markets,
              "fetchStatus": {
                  "status": "partial" if symbol_errors or errors else "success",
                  "availableMarkets": list(markets.keys()),
                  "symbolErrors": symbol_errors,
                  "apiErrorCount": len(errors)
              }
          }

          diagnostics = {
              "schemaVersion": 1,
              "generatedAt": generated,
              "checks": checks,
              "errors": errors,
              "symbolErrors": symbol_errors,
              "availableMarkets": list(markets.keys())
          }

          def atomic_json(path, value):
              os.makedirs(os.path.dirname(path) or ".", exist_ok=True)
              fd, temp = tempfile.mkstemp(prefix=".tmp-", dir=os.path.dirname(path) or ".")
              try:
                  with os.fdopen(fd, "w", encoding="utf-8") as f:
                      json.dump(value, f, ensure_ascii=False, separators=(",", ":"))
                      f.write("\n")
                  os.replace(temp, path)
              except Exception:
                  if os.path.exists(temp):
                      os.remove(temp)
                  raise

          atomic_json("data/markets.json", output)
          atomic_json("data/market-diagnostics.json", diagnostics)
          atomic_json("data/fetch-status.json", {
              "time": generated,
              "status": output["fetchStatus"]["status"],
              "markets": output["fetchStatus"]["availableMarkets"],
              "symbolErrors": symbol_errors,
              "errors": errors
          })

          print("Published markets:", ", ".join(markets))
          print("API errors:", len(errors))
          print("Symbol errors:", json.dumps(symbol_errors, ensure_ascii=False))
          PY

      - name: Validate published data
        run: |
          python - <<'PY'
          import json
          with open("data/markets.json", encoding="utf-8") as f:
              data = json.load(f)
          markets = data.get("markets", {})
          btc = markets.get("BTC", {})
          candles = btc.get("timeframes", {}).get("4h", {}).get("klines", [])
          if len(candles) < 30:
              raise SystemExit("Validation failed: BTC 4H candles < 30")
          for symbol, item in markets.items():
              rows = item.get("timeframes", {}).get("4h", {}).get("klines", [])
              if len(rows) < 30:
                  raise SystemExit("Validation failed: invalid 4H data for " + symbol)
              if any(len(row) < 9 or str(row[8]) != "1" for row in rows):
                  raise SystemExit("Validation failed: unconfirmed candle in " + symbol)
          print("Validation OK:", {k: len(v["timeframes"]["4h"]["klines"]) for k,v in markets.items()})
          PY

      - name: Commit market data and diagnostics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/markets.json data/market-diagnostics.json data/fetch-status.json
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "Update market data and diagnostics"
            git push
          fi
