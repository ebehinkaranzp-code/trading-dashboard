name: Update Market Data

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: update-market-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch market data
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python - <<'PY'
          import json, os, time, tempfile, urllib.request, urllib.parse
          from datetime import datetime, timezone

          BASE = "https://www.okx.com"
          COINS = {
              "BTC": ["BTC-USDT", "BTC-USDT-SWAP"],
              "ETH": ["ETH-USDT", "ETH-USDT-SWAP"],
              "LTC": ["LTC-USDT", "LTC-USDT-SWAP"],
              "BCH": ["BCH-USDT", "BCH-USDT-SWAP"],
              "UNI": ["UNI-USDT", "UNI-USDT-SWAP"],
              "GOLD": ["XAU-USDT-SWAP"],
          }
          TIMEFRAMES = {"4h": "4H", "1d": "1D", "1w": "1W"}
          errors = []
          checks = {}

          def iso_now():
              return datetime.now(timezone.utc).isoformat()

          def get(path, params=None):
              query = urllib.parse.urlencode(params or {})
              endpoint = path + ("?" + query if query else "")
              url = BASE + endpoint
              try:
                  req = urllib.request.Request(
                      url, headers={"User-Agent": "TradingDashboard/3.0"}
                  )
                  with urllib.request.urlopen(req, timeout=25) as response:
                      body = json.loads(response.read().decode("utf-8"))
                  if body.get("code") != "0":
                      raise RuntimeError(
                          "OKX " + str(body.get("code")) + ": " + str(body.get("msg"))
                      )
                  rows = body.get("data", [])
                  checks[endpoint] = {
                      "status": "success",
                      "records": len(rows) if isinstance(rows, list) else 1
                  }
                  return rows if isinstance(rows, list) else []
              except Exception as exc:
                  message = str(exc)
                  checks[endpoint] = {"status": "error", "message": message}
                  errors.append({"endpoint": endpoint, "error": message})
                  print("API ERROR:", endpoint, message)
                  return []

          def valid_candles(rows):
              valid = []
              for row in rows:
                  if not isinstance(row, list) or len(row) < 9 or str(row[8]) != "1":
                      continue
                  try:
                      ts, op, hi, lo, cl = map(float, row[:5])
                      vol = float(row[7] if row[7] not in ("", None) else row[6])
                      if (ts > 0 and op > 0 and hi > 0 and lo > 0 and cl > 0
                          and vol >= 0 and hi >= max(op, cl)
                          and lo <= min(op, cl) and hi >= lo):
                          valid.append(row)
                  except (TypeError, ValueError):
                      continue
              # Oldest first; remove duplicate timestamps.
              valid.sort(key=lambda x: int(x[0]))
              unique = []
              seen = set()
              for row in valid:
                  stamp = str(row[0])
                  if stamp not in seen:
                      unique.append(row)
                      seen.add(stamp)
              return unique

          def fetch_candles(instrument, interval):
              # Try the current-candles endpoint first, then the history endpoint.
              best = []
              for endpoint in ("/api/v5/market/candles", "/api/v5/market/history-candles"):
                  rows = get(endpoint, {"instId": instrument, "bar": interval, "limit": "300"})
                  valid = valid_candles(rows)
                  if len(valid) > len(best):
                      best = valid
                  if len(best) >= 30:
                      break
              return best

          markets = {}
          symbol_errors = {}
          previous_markets = {}
          try:
              with open("data/markets.json", encoding="utf-8") as old_file:
                  old_payload = json.load(old_file)
              previous_markets = old_payload.get("markets", {}) or {}
          except Exception:
              previous_markets = {}

          for coin, candidates in COINS.items():
              print("Fetching", coin, candidates)
              selected_symbol = None
              selected_timeframes = None
              for candidate in candidates:
                  timeframes = {}
                  for label, interval in TIMEFRAMES.items():
                      candles = fetch_candles(candidate, interval)
                      timeframes[label] = {"klines": candles}
                      print(coin, candidate, label, "valid candles:", len(candles))
                  if len(timeframes["4h"]["klines"]) >= 30:
                      selected_symbol = candidate
                      selected_timeframes = timeframes
                      break
              if selected_symbol is None:
                  reason = "کمتر از ۳۰ کندل معتبر 4H از همه نمادهای جایگزین دریافت شد"
                  symbol_errors[coin] = [reason]
                  # Keep the last known good payload visible instead of making a
                  # temporary API issue erase the market from the dashboard.
                  old_item = previous_markets.get(coin)
                  if old_item:
                      old_item = dict(old_item)
                      old_item["dataStatus"] = "stale"
                      old_item["lastSuccessfulAt"] = old_item.get("updatedAt") or old_payload.get("generatedAt")
                      old_item["fetchError"] = reason
                      markets[coin] = old_item
                  continue

              # Archive lower-timeframe candles and raw public trades for genuine
              # order-flow analysis. These are separate from the dashboard's
              # decision timeframes (4H/1D/1W).
              from datetime import datetime, timezone
              day = datetime.now(timezone.utc).strftime("%Y-%m-%d")
              intraday = {}
              for tf_label, tf_interval in (("1m", "1m"), ("5m", "5m"), ("15m", "15m")):
                  intraday[tf_label] = fetch_candles(selected_symbol, tf_interval)
              trade_rows = get("/api/v5/market/trades", {
                  "instId": selected_symbol, "limit": "500"
              })
              archive_dir = os.path.join("data", "history", coin)
              os.makedirs(archive_dir, exist_ok=True)
              archive_path = os.path.join(archive_dir, day + ".json")
              archive = {"schemaVersion": 1, "symbol": selected_symbol,
                         "date": day, "source": "OKX public market candles and trades",
                         "timeframes": {"1m": [], "5m": [], "15m": []}, "trades": []}
              try:
                  with open(archive_path, encoding="utf-8") as archive_file:
                      archive = json.load(archive_file)
              except Exception:
                  pass
              for tf_label, rows in intraday.items():
                  by_ts = {str(x[0]): x for x in archive.get("timeframes", {}).get(tf_label, [])}
                  for row in rows:
                      by_ts[str(row[0])] = row
                  archive.setdefault("timeframes", {})[tf_label] = sorted(
                      by_ts.values(), key=lambda x: int(x[0]))[-20000:]
              old_trades = {str(x.get("tradeId", x.get("ts", ""))): x
                            for x in archive.get("trades", []) if isinstance(x, dict)}
              for trade in trade_rows:
                  if isinstance(trade, dict) and trade.get("tradeId"):
                      old_trades[str(trade["tradeId"])] = trade
              archive["trades"] = sorted(
                  old_trades.values(), key=lambda x: int(x.get("ts", 0)))[-100000:]
              archive["updatedAt"] = iso_now()
              with open(archive_path, "w", encoding="utf-8") as archive_file:
                  json.dump(archive, archive_file, ensure_ascii=False, separators=(",", ":"))
              print(coin, "intraday archive:", {k: len(v) for k, v in intraday.items()},
                    "raw trades received:", len(trade_rows))

              # Gold has a real OKX SWAP market, but Rubik long/short and taker
              # statistics are not assumed to exist for metals.
              swap = selected_symbol if selected_symbol.endswith("-SWAP") else coin + "-USDT-SWAP"
              derivatives = {
                  "source": "OKX",
                  "instrument": swap,
                  "openInterest": get("/api/v5/public/open-interest", {
                      "instType": "SWAP", "instId": swap
                  }),
                  "openInterestHistory": get(
                      "/api/v5/rubik/stat/contracts/open-interest-history",
                      {"instId": swap, "period": "4H", "limit": "100"}
                  ),
                  "funding": get("/api/v5/public/funding-rate", {"instId": swap}),
                  "fundingHistory": get(
                      "/api/v5/public/funding-rate-history",
                      {"instId": swap, "limit": "100"}
                  ),
                  "longShortRatio": [] if coin == "GOLD" else get(
                      "/api/v5/rubik/stat/contracts/long-short-account-ratio",
                      {"ccy": coin, "period": "1H"}
                  ),
                  "takerRatio": [] if coin == "GOLD" else get(
                      "/api/v5/rubik/stat/taker-volume",
                      {"ccy": coin, "instType": "CONTRACTS", "period": "1H"}
                  ),
              }

              markets[coin] = {
                  "symbol": selected_symbol,
                  "okxInstrument": selected_symbol,
                  "source": "OKX",
                  "updatedAt": iso_now(),
                  "dataStatus": "fresh",
                  "timeframes": selected_timeframes,
                  "derivatives": derivatives,
              }

          # The interface has both GOLD and XAU buttons; both use the same OKX feed.
          if "GOLD" in markets:
              markets["XAU"] = markets["GOLD"]

          # BTC is the only hard requirement. ETH/gold API hiccups must not
          # cancel the entire run or prevent publication of the other markets.
          if "BTC" not in markets or len(markets["BTC"].get("timeframes", {}).get("4h", {}).get("klines", [])) < 30:
              raise SystemExit("BTC 4H data unavailable or invalid; existing markets.json preserved.")

          generated = iso_now()
          output = {
              "schemaVersion": 3,
              "generatedAt": generated,
              "priceSource": "OKX spot history candles",
              "derivativesSource": "OKX public derivatives endpoints",
              "source": "OKX",
              "markets": markets,
              "fetchStatus": {
                  "status": "partial" if symbol_errors or errors else "success",
                  "availableMarkets": list(markets.keys()),
                  "symbolErrors": symbol_errors,
                  "apiErrorCount": len(errors)
              }
          }

          diagnostics = {
              "schemaVersion": 1,
              "generatedAt": generated,
              "checks": checks,
              "errors": errors,
              "symbolErrors": symbol_errors,
              "availableMarkets": list(markets.keys())
          }

          def atomic_json(path, value):
              os.makedirs(os.path.dirname(path) or ".", exist_ok=True)
              fd, temp = tempfile.mkstemp(prefix=".tmp-", dir=os.path.dirname(path) or ".")
              try:
                  with os.fdopen(fd, "w", encoding="utf-8") as f:
                      json.dump(value, f, ensure_ascii=False, separators=(",", ":"))
                      f.write("\n")
                  os.replace(temp, path)
              except Exception:
                  if os.path.exists(temp):
                      os.remove(temp)
                  raise

          atomic_json("data/markets.json", output)
          atomic_json("data/market-diagnostics.json", diagnostics)
          atomic_json("data/fetch-status.json", {
              "time": generated,
              "status": output["fetchStatus"]["status"],
              "markets": output["fetchStatus"]["availableMarkets"],
              "symbolErrors": symbol_errors,
              "errors": errors
          })

          print("Published markets:", ", ".join(markets))
          print("API errors:", len(errors))
          print("Symbol errors:", json.dumps(symbol_errors, ensure_ascii=False))
          PY

      - name: Validate published data
        run: |
          python - <<'PY'
          import json
          with open("data/markets.json", encoding="utf-8") as f:
              data = json.load(f)
          markets = data.get("markets", {})
          btc = markets.get("BTC", {})
          candles = btc.get("timeframes", {}).get("4h", {}).get("klines", [])
          if len(candles) < 30:
              raise SystemExit("Validation failed: BTC 4H candles < 30")
          for symbol, item in markets.items():
              rows = item.get("timeframes", {}).get("4h", {}).get("klines", [])
              if item.get("dataStatus") == "stale":
                  continue
              if any(len(row) < 9 or str(row[8]) != "1" for row in rows):
                  raise SystemExit("Validation failed: unconfirmed candle in " + symbol)
          print("Validation OK:", {k: len(v.get("timeframes", {}).get("4h", {}).get("klines", [])) for k,v in markets.items()})
          PY

      - name: Commit market data and diagnostics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/markets.json data/market-diagnostics.json data/fetch-status.json data/history/
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "Update market data and diagnostics"
            git push
          fi
