name: CoinGecko API Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Test CoinGecko public market data
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python - <<'PY'
          import json, time, urllib.parse, urllib.request
          from datetime import datetime, timezone

          BASE = "https://api.coingecko.com/api/v3"
          COINS = {
              "BTC": "bitcoin",
              "ETH": "ethereum",
              "SOL": "solana",
              "BNB": "binancecoin",
              "XRP": "ripple",
              "DOGE": "dogecoin",
              "ADA": "cardano",
              "LTC": "litecoin",
          }
          report = {
              "testedAt": datetime.now(timezone.utc).isoformat(),
              "provider": "CoinGecko public API",
              "tests": {},
              "markets": {},
              "candles": {},
              "errors": [],
          }

          def get(path, params):
              url = BASE + path + "?" + urllib.parse.urlencode(params)
              req = urllib.request.Request(
                  url,
                  headers={
                      "Accept": "application/json",
                      "User-Agent": "TradingDashboard-CoinGecko-Test/1.0",
                  },
              )
              with urllib.request.urlopen(req, timeout=25) as response:
                  return json.loads(response.read().decode("utf-8"))

          # One bulk request checks aggregated market coverage and market fields.
          try:
              rows = get("/coins/markets", {
                  "vs_currency": "usd",
                  "order": "market_cap_desc",
                  "per_page": "250",
                  "page": "1",
                  "sparkline": "false",
                  "price_change_percentage": "24h",
              })
              by_id = {row.get("id"): row for row in rows if isinstance(row, dict)}
              for symbol, coin_id in COINS.items():
                  row = by_id.get(coin_id)
                  if row:
                      report["markets"][symbol] = {
                          "id": coin_id,
                          "price": row.get("current_price"),
                          "market_cap": row.get("market_cap"),
                          "total_volume_24h": row.get("total_volume"),
                          "price_change_24h_pct": row.get("price_change_percentage_24h"),
                          "last_updated": row.get("last_updated"),
                      }
                  else:
                      report["errors"].append(symbol + ": missing from /coins/markets top 250")
              report["tests"]["bulk_markets"] = {
                  "status": "success",
                  "records": len(rows),
                  "requested_assets_found": len(report["markets"]),
              }
          except Exception as exc:
              report["tests"]["bulk_markets"] = {"status": "failed", "error": str(exc)}
              report["errors"].append("bulk markets: " + str(exc))

          # Free public-plan OHLC is auto-granular. A 30-day request is
          # expected to return 4-hour candles; we record the actual result.
          for symbol, coin_id in COINS.items():
              try:
                  rows = get("/coins/" + coin_id + "/ohlc", {
                      "vs_currency": "usd",
                      "days": "30",
                  })
                  valid = []
                  for row in rows if isinstance(rows, list) else []:
                      if not isinstance(row, list) or len(row) < 5:
                          continue
                      try:
                          ts, op, hi, lo, cl = map(float, row[:5])
                          if ts > 0 and min(op, hi, lo, cl) > 0 and hi >= max(op, cl, lo) and lo <= min(op, cl, hi):
                              valid.append(row[:5])
                      except (TypeError, ValueError):
                          pass
                  report["candles"][symbol] = {
                      "status": "success" if len(valid) >= 30 else "insufficient",
                      "records": len(valid),
                      "first_timestamp": valid[0][0] if valid else None,
                      "last_timestamp": valid[-1][0] if valid else None,
                      "sample": valid[-2:] if valid else [],
                      "expected_free_plan_granularity": "4-hour for 30-day range",
                  }
                  if len(valid) < 30:
                      report["errors"].append(symbol + ": fewer than 30 valid OHLC candles")
              except Exception as exc:
                  report["candles"][symbol] = {"status": "failed", "error": str(exc)}
                  report["errors"].append(symbol + " OHLC: " + str(exc))
              time.sleep(1.2)

          report["overall"] = (
              "success"
              if report["tests"].get("bulk_markets", {}).get("status") == "success"
              and len(report["markets"]) >= 6
              and sum(1 for x in report["candles"].values() if x.get("status") == "success") >= 6
              else "failed_or_partial"
          )

          with open("coingecko-test-report.json", "w", encoding="utf-8") as f:
              json.dump(report, f, ensure_ascii=False, indent=2)

          print(json.dumps(report, ensure_ascii=False, indent=2))
          if report["overall"] != "success":
              raise SystemExit("CoinGecko test did not meet validation thresholds.")
          PY

      - name: Publish test summary
        if: always()
        run: |
          if [ -f coingecko-test-report.json ]; then
            python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          d=json.load(open("coingecko-test-report.json", encoding="utf-8"))
          print("# CoinGecko API test")
          print()
          print("**Overall:** " + str(d.get("overall")))
          print()
          print("| Asset | OHLC candles (30d) | Status |")
          print("|---|---:|---|")
          for k,v in d.get("candles",{}).items():
              print(f"| {k} | {v.get('records',0)} | {v.get('status')} |")
          print()
          print("**Market assets found:** " + str(len(d.get("markets",{}))))
          for e in d.get("errors",[]):
              print("- " + str(e))
          PY
          fi

      - name: Upload test report
        if: always() && hashFiles('coingecko-test-report.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: coingecko-api-test-report
          path: coingecko-test-report.json
          retention-days: 14
