name: Build Dynamic Data Catalog

on:
  workflow_dispatch:
  push:
    paths:
      - 'data/**/markets.json'
      - 'data/markets.json'
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: write

concurrency:
  group: trading-data-catalog
  queue: max

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Discover market archives and build catalog
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('data')
          sources = []
          for markets_file in sorted(root.rglob('markets.json')):
              if not markets_file.is_file():
                  continue
              rel = markets_file.relative_to(root)
              folder = rel.parent
              try:
                  payload = json.loads(markets_file.read_text(encoding='utf-8'))
              except Exception as exc:
                  print(f'SKIP invalid JSON: {markets_file}: {exc}')
                  continue
              markets = payload.get('markets') if isinstance(payload, dict) else None
              if not isinstance(markets, dict) or not markets:
                  print(f'SKIP no markets map: {markets_file}')
                  continue

              if str(folder) == '.':
                  source_id = str(payload.get('sourceId') or 'okx').lower().replace(' ', '-')
                  default_label = str(payload.get('source') or 'Primary Archive')
                  history_dir = root / 'history'
                  trade_symbol = '{asset}-USDT-SWAP' if source_id == 'okx' else '{asset}USDT'
              else:
                  source_id = str(folder).replace('/', '-').lower()
                  default_label = source_id.replace('-', ' ').title()
                  history_dir = root / folder / 'history'
                  trade_symbol = '{asset}USDT'

              source_label = str(payload.get('displayName') or payload.get('provider') or default_label)
              history_root = f'./data/{folder}/history/' if str(folder) != '.' else './data/history/'
              if not history_dir.is_dir():
                  history_root = ''

              sources.append({
                  'id': source_id,
                  'label': source_label,
                  'markets': './' + markets_file.as_posix(),
                  'historyRoot': history_root,
                  'tradeSymbol': trade_symbol,
                  'format': 'canonical',
                  'assets': sorted(markets.keys())
              })

          catalog = {
              'schemaVersion': 1,
              'generatedAt': __import__('datetime').datetime.now(__import__('datetime').timezone.utc).isoformat(),
              'discovery': 'all data/**/markets.json files with a valid markets object',
              'sources': sources
          }
          out = root / 'catalog.json'
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_text(json.dumps(catalog, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print(json.dumps(catalog, ensure_ascii=False, indent=2))
          if not sources:
              raise SystemExit('No valid market archives found; catalog was not useful.')
          PY

      - name: Commit catalog if changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/catalog.json
          if git diff --cached --quiet; then
            echo 'Catalog is already current.'
          else
            git commit -m 'chore(data): rebuild dynamic source catalog [skip ci]'
            git push origin HEAD:main
          fi
