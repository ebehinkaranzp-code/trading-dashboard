name: Import Footprint Trades

on:
  workflow_dispatch:
  schedule:
    - cron: "25 2 * * *"

permissions:
  contents: write

concurrency:
  group: import-footprint-trades
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Download and compact BTC aggregate trades
        shell: bash
        run: |
          python - <<'PY'
          import csv
          import datetime as dt
          import io
          import json
          import urllib.error
          import urllib.request
          import zipfile
          from collections import defaultdict
          from pathlib import Path
          from decimal import Decimal

          BASE = "https://data.binance.vision/data/spot/daily/aggTrades/BTCUSDT"
          OUT = Path("data/history/BTC")
          OUT.mkdir(parents=True, exist_ok=True)

          today = dt.datetime.now(dt.timezone.utc).date()
          imported = 0
          total_records = 0

          # The dashboard reads daily files containing a `trades` array.
          # Compact prints into 1-minute + exact-price + aggressor-side buckets.
          # This keeps the archive small enough for GitHub while preserving
          # buy/sell volume at each price level for footprint calculations.
          for offset in range(1, 8):
              day = today - dt.timedelta(days=offset)
              day_text = day.isoformat()
              filename = f"BTCUSDT-aggTrades-{day_text}.zip"
              url = f"{BASE}/{filename}"
              print(f"Downloading {filename}", flush=True)

              request = urllib.request.Request(
                  url, headers={"User-Agent": "TradingDashboard-Footprint/2.0"}
              )
              try:
                  with urllib.request.urlopen(request, timeout=180) as response:
                      archive_bytes = response.read()
              except urllib.error.HTTPError as exc:
                  if exc.code == 404:
                      print(f"Archive not published: {day_text}", flush=True)
                      continue
                  raise

              buckets = defaultdict(Decimal)
              with zipfile.ZipFile(io.BytesIO(archive_bytes)) as archive:
                  csv_name = next(
                      (name for name in archive.namelist() if name.lower().endswith(".csv")),
                      None,
                  )
                  if not csv_name:
                      print(f"No CSV in {filename}", flush=True)
                      continue

                  with archive.open(csv_name) as raw:
                      stream = io.TextIOWrapper(raw, encoding="utf-8", newline="")
                      for row in csv.reader(stream):
                          if not row or len(row) < 7:
                              continue
                          try:
                              ts = int(row[5])
                              if ts > 10**14:
                                  ts //= 1000
                              minute_ms = (ts // 60000) * 60000
                              price = row[1]
                              qty = Decimal(row[2])
                              # buyer-is-maker=true means the taker was selling.
                              side = "sell" if row[6].strip().lower() == "true" else "buy"
                              buckets[(minute_ms, price, side)] += qty
                          except (ValueError, IndexError):
                              continue

              compact_trades = []
              for (minute_ms, price, side), qty in sorted(buckets.items()):
                  compact_trades.append({
                      "tradeId": f"{minute_ms}-{price}-{side}",
                      "ts": minute_ms,
                      "px": price,
                      "sz": format(qty, "f"),
                      "side": side
                  })

              target = OUT / f"{day_text}.json"
              old = {}
              if target.exists():
                  try:
                      old = json.loads(target.read_text(encoding="utf-8"))
                  except Exception:
                      old = {}
              if not isinstance(old, dict):
                  old = {}

              # Preserve any existing candle/timeframe history in the file.
              old["date"] = day_text
              old["asset"] = "BTC"
              old["trades"] = compact_trades
              target.write_text(
                  json.dumps(old, separators=(",", ":"), ensure_ascii=False),
                  encoding="utf-8"
              )

              imported += 1
              total_records += len(compact_trades)
              print(
                  f"{day_text}: {len(compact_trades):,} compact footprint rows "
                  f"({target.stat().st_size:,} bytes)",
                  flush=True
              )

          print(
              f"Finished: {imported} days imported, {total_records:,} compact rows.",
              flush=True
          )
          PY

      - name: Commit and push compact archive
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/history/BTC
          if git diff --cached --quiet; then
            echo "No trade-history changes to commit."
            exit 0
          fi
          git commit -m "Import compact BTC footprint trade history"

          # Retry transient GitHub HTTP timeouts.
          for attempt in 1 2 3; do
            echo "Push attempt ${attempt}/3"
            if git -c http.version=HTTP/1.1 push origin HEAD:main; then
              echo "Push completed."
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep $((attempt * 10))
              git fetch origin main
              git rebase origin/main
            fi
          done
          echo "Push failed after 3 attempts."
          exit 1
