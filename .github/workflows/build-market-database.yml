name: Build BTC-LTC Market Database

on:
  workflow_dispatch:
    inputs:
      start_month:
        description: 'First month to download (YYYY-MM)'
        required: true
        default: '2017-01'
        type: string
      end_month:
        description: 'Last month (YYYY-MM). Leave blank for latest complete month.'
        required: false
        default: ''
        type: string
      include_aggregate_trades:
        description: 'Also download Spot aggregate trades (large download)'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  build-database:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --upgrade pip requests

      - name: Build database
        shell: bash
        run: |
          ARGS=(--start-month "${{ inputs.start_month }}")
          if [[ -n "${{ inputs.end_month }}" ]]; then
            ARGS+=(--end-month "${{ inputs.end_month }}")
          fi
          if [[ "${{ inputs.include_aggregate_trades }}" == "true" ]]; then
            ARGS+=(--trades)
          fi
          python build_btc_ltc_db.py "${ARGS[@]}"

      - name: Upload SQLite database
        uses: actions/upload-artifact@v4
        with:
          name: btc-ltc-market-history
          path: market_history.sqlite
          if-no-files-found: error
          retention-days: 7
