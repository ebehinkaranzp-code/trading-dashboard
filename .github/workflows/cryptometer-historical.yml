name: CryptoMeter Historical Archive

on:
  workflow_dispatch:
    inputs:
      symbols:
        description: "Comma-separated base symbols (example: BTC,ETH,LTC,BCH,UNI)"
        required: true
        default: "BTC,ETH,LTC,BCH,UNI"
        type: string
      exchange:
        description: "CryptoMeter exchange identifier"
        required: true
        default: "okx"
        type: choice
        options:
          - okx
          - binance
          - bybit
          - coinbase_pro
          - kraken

permissions:
  contents: write

concurrency:
  group: cryptometer-historical-archive
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade requests

      - name: Download historical OHLCV from CryptoMeter
        env:
          CRYPTOMETER_API_KEY: ${{ secrets.CRYPTOMETER_API_KEY }}
          CRYPTOMETER_SYMBOLS: ${{ inputs.symbols }}
          CRYPTOMETER_EXCHANGE: ${{ inputs.exchange }}
        run: python scripts/cryptometer_history.py

      - name: Commit only CryptoMeter archive
        run: |
          if [ -z "$(git status --porcelain data/cryptometer/)" ]; then
            echo "No CryptoMeter archive changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/cryptometer/
          git commit -m "Update CryptoMeter historical archive"
          git push
