name: Trading Dashboard Diagnostics

on:
  workflow_dispatch:
  schedule:
    - cron: "* * * * *"

permissions:
  contents: write
  actions: read

concurrency:
  group: trading-dashboard-diagnostics
  cancel-in-progress: true

jobs:
  diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install browser
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Run browser and data diagnostics
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PAGES_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: |
          node <<'NODE'
          const fs = require('fs');
          const { chromium } = require('playwright');

          const report = {
            schemaVersion: 1,
            generatedAt: new Date().toISOString(),
            repository: process.env.GITHUB_REPOSITORY,
            siteUrl: process.env.PAGES_URL,
            overall: "running",
            summary: {},
            browser: { consoleErrors: [], pageErrors: [], failedRequests: [], responses: [] },
            data: {},
            workflows: {},
            checks: [],
            history: []
          };

          const add = (name, status, detail = "") =>
            report.checks.push({ name, status, detail, at: new Date().toISOString() });

          async function main() {
            let browser;
            try {
              const apiHeaders = {
                Accept: "application/vnd.github+json",
                Authorization: `Bearer ${process.env.GITHUB_TOKEN}`,
                "X-GitHub-Api-Version": "2022-11-28"
              };

              // Preserve a short history from the previous report.
              try {
                const old = JSON.parse(fs.readFileSync("diagnostics/report.json", "utf8"));
                report.history = Array.isArray(old.history) ? old.history.slice(-49) : [];
                if (old.generatedAt) report.history.push({
                  generatedAt: old.generatedAt,
                  overall: old.overall || "unknown",
                  errorCount: (old.browser?.consoleErrors?.length || 0) +
                              (old.browser?.pageErrors?.length || 0) +
                              (old.browser?.failedRequests?.length || 0)
                });
                report.history = report.history.slice(-50);
              } catch {}

              // Test the public data file independently.
              const dataUrl = new URL("data/markets.json", process.env.PAGES_URL).toString();
              try {
                const r = await fetch(dataUrl, { cache: "no-store" });
                report.data.httpStatus = r.status;
                if (!r.ok) throw new Error(`HTTP ${r.status}`);
                const payload = await r.json();
                const markets = payload.markets || {};
                report.data.topLevelKeys = Object.keys(payload);
                report.data.marketSymbols = Object.keys(markets);
                report.data.generatedAt = payload.generatedAt || payload.updatedAt || null;
                report.data.marketDetails = {};
                for (const [symbol, item] of Object.entries(markets)) {
                  const tfs = item?.timeframes || {};
                  report.data.marketDetails[symbol] = {
                    timeframes: Object.keys(tfs),
                    candleCounts: Object.fromEntries(Object.entries(tfs).map(([tf, v]) => {
                      const rows = Array.isArray(v) ? v : (v?.klines || v?.candles || v?.data || []);
                      return [tf, Array.isArray(rows) ? rows.length : 0];
                    })),
                    derivativeKeys: Object.keys(item?.derivatives || {})
                  };
                }
                add("markets.json", "ok", `HTTP ${r.status}; ${Object.keys(markets).length} markets`);
              } catch (e) {
                report.data.error = String(e?.stack || e);
                add("markets.json", "error", report.data.error);
              }

              // Load the actual published dashboard in Chromium.
              browser = await chromium.launch({ headless: true });
              const page = await browser.newPage();
              page.on("console", msg => {
                if (msg.type() === "error") report.browser.consoleErrors.push(msg.text());
              });
              page.on("pageerror", err => report.browser.pageErrors.push(String(err?.stack || err)));
              page.on("requestfailed", req => report.browser.failedRequests.push({
                url: req.url(), method: req.method(), error: req.failure()?.errorText || "request failed"
              }));
              page.on("response", res => {
                if (res.status() >= 400) report.browser.responses.push({
                  url: res.url(), status: res.status()
                });
              });

              try {
                const response = await page.goto(process.env.PAGES_URL, {
                  waitUntil: "domcontentloaded", timeout: 45000
                });
                report.browser.httpStatus = response?.status() ?? null;
                await page.waitForTimeout(9000);
                report.browser.title = await page.title();
                report.browser.url = page.url();
                report.browser.chartPresent = await page.locator("#tv_chart").count().then(n => n > 0);
                report.browser.chartCanvasCount = await page.locator("#tv_chart canvas").count();
                report.browser.statusText = await page.locator("#chartStatus").textContent().catch(() => null);
                report.browser.loadStateText = await page.locator("#loadState").textContent().catch(() => null);
                report.browser.selectedMarket = await page.locator("#marketLabel").textContent().catch(() => null);
                add("dashboard page", response?.ok() ? "ok" : "error",
                     `HTTP ${response?.status()}; title=${report.browser.title || ""}`);
              } catch (e) {
                report.browser.navigationError = String(e?.stack || e);
                add("dashboard page", "error", report.browser.navigationError);
              }

              // Read recent GitHub Actions runs, including failed workflow runs.
              try {
                const repo = process.env.GITHUB_REPOSITORY;
                const r = await fetch(`https://api.github.com/repos/${repo}/actions/runs?per_page=20`, {
                  headers: apiHeaders
                });
                if (!r.ok) throw new Error(`GitHub Actions API HTTP ${r.status}`);
                const body = await r.json();
                report.workflows.httpStatus = r.status;
                report.workflows.runs = (body.workflow_runs || []).map(x => ({
                  name: x.name, workflow: x.path, status: x.status,
                  conclusion: x.conclusion, runNumber: x.run_number,
                  event: x.event, createdAt: x.created_at, updatedAt: x.updated_at,
                  url: x.html_url
                }));
                report.workflows.failedRecent = report.workflows.runs.filter(x =>
                  x.conclusion === "failure" || x.conclusion === "cancelled"
                );
                add("GitHub Actions history", "ok",
                    `${report.workflows.runs.length} recent runs; ${report.workflows.failedRecent.length} failed/cancelled`);
              } catch (e) {
                report.workflows.error = String(e?.stack || e);
                add("GitHub Actions history", "warning", report.workflows.error);
              }

              const browserErrors = report.browser.consoleErrors.length +
                report.browser.pageErrors.length + report.browser.failedRequests.length +
                report.browser.responses.length;
              report.summary = {
                checkCount: report.checks.length,
                errors: report.checks.filter(x => x.status === "error").length +
                        report.browser.pageErrors.length + report.browser.consoleErrors.length +
                        report.browser.failedRequests.length + report.browser.responses.length,
                warnings: report.checks.filter(x => x.status === "warning").length,
                browserErrors,
                failedWorkflowRuns: report.workflows.failedRecent?.length || 0
              };
              report.overall = report.summary.errors ? "issues" :
                               report.summary.warnings ? "warning" : "healthy";
            } catch (e) {
              report.fatalError = String(e?.stack || e);
              report.overall = "failed";
            } finally {
              if (browser) await browser.close().catch(() => {});
              report.completedAt = new Date().toISOString();
              fs.mkdirSync("diagnostics", { recursive: true });
              fs.writeFileSync("diagnostics/report.json", JSON.stringify(report, null, 2) + "\n");
            }
          }
          main().catch(e => {
            report.fatalError = String(e?.stack || e);
            report.overall = "failed";
            report.completedAt = new Date().toISOString();
            fs.mkdirSync("diagnostics", { recursive: true });
            fs.writeFileSync("diagnostics/report.json", JSON.stringify(report, null, 2) + "\n");
            process.exitCode = 1;
          });
          NODE

      - name: Publish diagnostics report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diagnostics/report.json
          if git diff --cached --quiet; then
            echo "Diagnostics report unchanged."
          else
            git commit -m "Update automated diagnostics report"
            git push
          fi
