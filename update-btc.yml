
name: Update BTC market data and diagnostics

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: update-btc-market-data
  cancel-in-progress: true

jobs:
  fetch-and-report:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        id: checkout

      - name: Fetch BTC data
        id: fetch
        continue-on-error: true
        run: |
          python - <<'PY'
          import json, os, urllib.request, urllib.parse
          from datetime import datetime, timezone

          BASE = "https://www.okx.com"
          INST = "BTC-USDT-SWAP"
          checks = {}
          errors = []

          def get(path, params=None, required=False):
              query = urllib.parse.urlencode(params or {})
              url = BASE + path + ("?" + query if query else "")
              try:
                  req = urllib.request.Request(
                      url, headers={"User-Agent": "market-dashboard/1.0"}
                  )
                  with urllib.request.urlopen(req, timeout=25) as r:
                      result = json.loads(r.read().decode())

                  if result.get("code") != "0":
                      raise RuntimeError(result.get("msg", "API error"))

                  data = result.get("data", [])
                  checks[path] = {
                      "status": "success",
                      "records": len(data) if isinstance(data, list) else 1
                  }
                  return data

              except Exception as e:
                  checks[path] = {"status": "error", "message": str(e)}
                  errors.append(path + ": " + str(e))
                  if required:
                      raise
                  return []

          def normalize(rows, kind):
              result = []
              for x in rows or []:
                  if isinstance(x, dict):
                      result.append(x)
                  elif isinstance(x, list):
                      if kind == "oi" and len(x) >= 3:
                          result.append({
                              "ts": x[0], "oi": x[1], "oiCcy": x[2]
                          })
                      elif kind == "ls" and len(x) >= 2:
                          result.append({
                              "ts": x[0], "longShortRatio": x[1]
                          })
                      elif kind == "taker" and len(x) >= 3:
                          buy, sell = float(x[1]), float(x[2])
                          result.append({
                              "ts": x[0],
                              "buyVol": buy,
                              "sellVol": sell,
                              "buySellRatio": buy / sell if sell else None
                          })
              return result

          os.makedirs("data", exist_ok=True)

          payload = {
              "schemaVersion": 2,
              "generatedAt": datetime.now(timezone.utc).isoformat(),
              "source": "OKX",
              "symbol": INST,
              "timeframes": {},
              "derivatives": {}
          }

          try:
              for label, bar in [("4h", "4H"), ("1d", "1D"), ("1w", "1W")]:
                  rows = get("/api/v5/market/candles", {
                      "instId": INST, "bar": bar, "limit": "300"
                  }, required=(label == "4h"))
                  payload["timeframes"][label] = {"klines": rows}

              payload["derivatives"]["openInterest"] = get(
                  "/api/v5/public/open-interest",
                  {"instType": "SWAP", "instId": INST}
              )

              payload["derivatives"]["funding"] = get(
                  "/api/v5/public/funding-rate", {"instId": INST}
              )

              payload["derivatives"]["fundingHistory"] = get(
                  "/api/v5/public/funding-rate-history",
                  {"instId": INST, "limit": "100"}
              )

              payload["derivatives"]["openInterestHistory"] = normalize(
                  get("/api/v5/rubik/stat/contracts/open-interest-history", {
                      "instId": INST, "period": "4H", "limit": "100"
                  }), "oi"
              )

              payload["derivatives"]["longShortRatio"] = normalize(
                  get("/api/v5/rubik/stat/contracts/long-short-account-ratio", {
                      "ccy": "BTC", "period": "4H"
                  }), "ls"
              )

              payload["derivatives"]["takerRatio"] = normalize(
                  get("/api/v5/rubik/stat/taker-volume", {
                      "ccy": "BTC", "instType": "CONTRACTS", "period": "4H"
                  }), "taker"
              )

              with open("data/btc.json", "w", encoding="utf-8") as f:
                  json.dump(payload, f, ensure_ascii=False)

          except Exception as e:
              errors.append("MAIN: " + str(e))
              print("FETCH ERROR:", e)
              raise
          finally:
              with open("data/fetch-status.json", "w", encoding="utf-8") as f:
                  json.dump({
                      "checks": checks,
                      "errors": errors,
                      "time": datetime.now(timezone.utc).isoformat()
                  }, f, ensure_ascii=False, indent=2)
          PY

      - name: Validate data
        id: validate
        if: always()
        continue-on-error: true
        run: |
          python - <<'PY'
          import json, os
          path = "data/btc.json"
          if not os.path.exists(path):
              raise SystemExit("BTC data file was not created")
          with open(path, encoding="utf-8") as f:
              data = json.load(f)
          candles = data.get("timeframes", {}).get("4h", {}).get("klines", [])
          if not candles:
              raise SystemExit("No 4h candles found")
          print("JSON valid; 4h candles:", len(candles))
          PY

      - name: Create diagnostics report
        if: always()
        env:
          FETCH_STATUS: ${{ steps.fetch.outcome }}
          VALIDATE_STATUS: ${{ steps.validate.outcome }}
          RUN_ID: ${{ github.run_id }}
          RUN_NUMBER: ${{ github.run_number }}
          REPOSITORY: ${{ github.repository }}
          COMMIT: ${{ github.sha }}
        run: |
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone

          def read_json(path):
              try:
                  with open(path, encoding="utf-8") as f:
                      return json.load(f)
              except Exception as e:
                  return {"error": str(e)}

          fetch = read_json("data/fetch-status.json")
          btc = read_json("data/btc.json")

          candles = btc.get("timeframes", {}).get("4h", {}).get("klines", [])
          checks = fetch.get("checks", {})

          report = {
              "reportVersion": 1,
              "generatedAt": datetime.now(timezone.utc).isoformat(),
              "workflow": "Update BTC market data and diagnostics",
              "repository": os.environ["REPOSITORY"],
              "runId": os.environ["RUN_ID"],
              "runNumber": os.environ["RUN_NUMBER"],
              "runUrl": "https://github.com/" + os.environ["REPOSITORY"] + "/actions/runs/" + os.environ["RUN_ID"],
              "commit": os.environ["COMMIT"],
              "steps": {
                  "fetch": os.environ["FETCH_STATUS"],
                  "validation": os.environ["VALIDATE_STATUS"]
              },
              "data": {
                  "btcFileExists": os.path.exists("data/btc.json"),
                  "4hCandleCount": len(candles),
                  "derivatives": {
                      "openInterest": "openInterest" in checks,
                      "funding": "funding-rate" in str(checks),
                      "longShort": "long-short-account-ratio" in str(checks),
                      "taker": "taker-volume" in str(checks)
                  }
              },
              "apiChecks": checks,
              "errors": fetch.get("errors", []),
              "overallStatus": "success" if (
                  os.environ["FETCH_STATUS"] == "success"
                  and os.environ["VALIDATE_STATUS"] == "success"
              ) else "error"
          }

          os.makedirs("data", exist_ok=True)
          with open("data/diagnostics.json", "w", encoding="utf-8") as f:
              json.dump(report, f, ensure_ascii=False, indent=2)

          print(json.dumps(report, ensure_ascii=False, indent=2))
          PY

      - name: Commit data and report
        if: always() && steps.checkout.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update market data and diagnostics"
            git push
          fi
